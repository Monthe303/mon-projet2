name: expense_management
description: "A new Flutter project."

# Empêche la publication accidentelle sur pub.dev
publish_to: 'none'

# Version et numéro de build de l'application
version: 1.0.0+1

# Définition de l'environnement SDK
environment:
  sdk: ">=3.5.3 <4.0.0"

# Dépendances principales
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  uuid: ^4.1.0
  fl_chart: ^0.63.0  # Correction de la version
  provider: ^6.1.1
  pdf: ^3.10.7  # Pour générer des PDF
  printing: ^5.11.1  # Pour l'impression
  path_provider: ^2.1.2  # Pour accéder aux répertoires du système
  share_plus: ^10.1.4  # Pour le partage

# Dépendances pour le développement et les tests
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# Configuration spécifique à Flutter
flutter:
  uses-material-design: true
  generate: true
